version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduinsight-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    volumes:
      - ./backend/eduinsight.db:/app/eduinsight.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduinsight-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

